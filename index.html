<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinDojo - Learn Crypto Trading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        .logo { font-size: 80px; margin-bottom: 20px; }
        h1 { font-size: 48px; margin-bottom: 10px; color: #fff; }
        .tagline { font-size: 20px; color: #888; margin-bottom: 40px; }
        .features {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }
        .feature {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            width: 150px;
        }
        .feature-icon { font-size: 32px; margin-bottom: 10px; }
        .feature-text { font-size: 14px; color: #aaa; }
        .links { margin-top: 40px; }
        .links a {
            color: #4ade80;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
        }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🥋</div>
        <h1>CoinDojo</h1>
        <p class="tagline">Master crypto trading with virtual money</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">📈</div>
                <div class="feature-text">Real-time prices</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💰</div>
                <div class="feature-text">$1,000 virtual cash</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🏆</div>
                <div class="feature-text">Compete globally</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🎓</div>
                <div class="feature-text">Learn risk-free</div>
            </div>
        </div>

        <p style="color: #666; font-size: 14px;">Coming soon to the App Store</p>

        <div class="links">
            <a href="terms-of-service.html">Terms of Service</a>
            <a href="privacy-policy.html">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
